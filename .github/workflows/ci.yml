name: SQA CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Security Audit (npm audit)
      run: npm audit --audit-level=high

    - name: Upload Report Placeholder
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sqa-audit-report
        path: package.json
        retention-days: 7